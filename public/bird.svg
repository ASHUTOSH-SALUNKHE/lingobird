<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- LingoBird mascot bird mark — simple, friendly, easy to swap -->
  <!-- Background circle -->
  <circle cx="16" cy="16" r="14" fill="hsl(152,44%,42%)" opacity="0.15"/>
  <!-- Body -->
  <ellipse cx="16" cy="19" rx="7" ry="5" fill="hsl(152,44%,42%)"/>
  <!-- Wing -->
  <path d="M9 18 C6 13 14 11 16 15" fill="hsl(152,44%,42%)" opacity="0.7"/>
  <!-- Head -->
  <circle cx="21" cy="13" r="4" fill="hsl(152,44%,42%)"/>
  <!-- Eye -->
  <circle cx="22.5" cy="12.5" r="1" fill="white"/>
  <!-- Pupil -->
  <circle cx="22.7" cy="12.4" r="0.4" fill="hsl(152,44%,20%)"/>
  <!-- Beak -->
  <path d="M25 13.5 L28.5 12 L25 12" fill="hsl(152,44%,32%)"/>
  <!-- Tail feathers -->
  <path d="M10 21 C7 23 8 26 10 24 C8 27 11 28 12 25" fill="hsl(152,44%,36%)" opacity="0.8"/>
</svg>
